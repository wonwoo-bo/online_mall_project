server:
  port: 8080
  tomcat:
    basedir: ./temp/tomcat

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/online_mall?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mall.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.mall: DEBUG

# JWT配置
jwt:
  secret: your-secret-key-here-mall-project-2024
  expiration: 86400000 # 24小时，单位毫秒
